<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff" />
      <stop offset="100%" style="stop-color:#0097a7" />
    </linearGradient>
    <linearGradient id="cursor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b" />
      <stop offset="100%" style="stop-color:#ee5a24" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#bg)" />

  <!-- Eye shape -->
  <path d="M 18 58 Q 64 28 110 58 Q 64 88 18 58 Z"
        fill="#f5f5f5" fill-opacity="0.12" stroke="#e0e0e0" stroke-width="1.5" />

  <!-- Iris -->
  <circle cx="64" cy="58" r="14" fill="url(#iris)" opacity="0.85" />
  <circle cx="64" cy="58" r="6" fill="#0a0a0f" />
  <circle cx="60" cy="54" r="2.5" fill="white" opacity="0.7" />

  <!-- Cursor -->
  <polygon points="82,74 82,94 88,90 92,98 96,96 92,88 98,86"
           fill="url(#cursor)" stroke="#fff" stroke-width="1" stroke-linejoin="round" />

  <!-- Corner brackets -->
  <path d="M 14 22 L 14 14 L 22 14" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5" />
  <path d="M 114 22 L 114 14 L 106 14" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5" />
  <path d="M 14 106 L 14 114 L 22 114" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5" />
  <path d="M 114 106 L 114 114 L 106 114" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5" />
</svg>
