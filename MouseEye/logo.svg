<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097a7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cursor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)" />

  <!-- Eye shape (outer) -->
  <path d="M 80 240 Q 256 120 432 240 Q 256 360 80 240 Z"
        fill="none" stroke="#e0e0e0" stroke-width="6" opacity="0.9" />

  <!-- Eye white -->
  <path d="M 80 240 Q 256 120 432 240 Q 256 360 80 240 Z"
        fill="#f5f5f5" opacity="0.15" />

  <!-- Iris outer -->
  <circle cx="256" cy="240" r="72" fill="url(#iris)" opacity="0.3" filter="url(#glow-strong)" />
  <circle cx="256" cy="240" r="56" fill="url(#iris)" opacity="0.85" />

  <!-- Pupil -->
  <circle cx="256" cy="240" r="24" fill="#0a0a0f" />

  <!-- Iris detail rings -->
  <circle cx="256" cy="240" r="44" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4" />
  <circle cx="256" cy="240" r="36" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3" />

  <!-- Light reflection -->
  <circle cx="242" cy="226" r="8" fill="white" opacity="0.7" />
  <circle cx="268" cy="250" r="4" fill="white" opacity="0.4" />

  <!-- Cursor arrow -->
  <g transform="translate(340, 290) scale(1.1)" filter="url(#glow)">
    <polygon points="0,0 0,56 16,44 28,68 36,64 24,40 42,36"
             fill="url(#cursor)" stroke="#ffffff" stroke-width="2.5"
             stroke-linejoin="round" />
  </g>

  <!-- Scan lines (tech aesthetic) -->
  <line x1="100" y1="240" x2="170" y2="240" stroke="#00d4ff" stroke-width="1" opacity="0.3" />
  <line x1="342" y1="240" x2="412" y2="240" stroke="#00d4ff" stroke-width="1" opacity="0.3" />
  <line x1="256" y1="155" x2="256" y2="178" stroke="#00d4ff" stroke-width="1" opacity="0.3" />
  <line x1="256" y1="302" x2="256" y2="325" stroke="#00d4ff" stroke-width="1" opacity="0.3" />

  <!-- Corner brackets (HUD style) -->
  <path d="M 60 90 L 60 60 L 90 60" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.5" />
  <path d="M 452 90 L 452 60 L 422 60" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.5" />
  <path d="M 60 422 L 60 452 L 90 452" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.5" />
  <path d="M 452 422 L 452 452 L 422 452" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.5" />

  <!-- Title -->
  <text x="256" y="445" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="42" font-weight="700" fill="#e0e0e0" letter-spacing="6">
    MOUSE EYE
  </text>
</svg>
